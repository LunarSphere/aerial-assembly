[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flight"
version = "0.1.0"
description = "One cflib flight program for the Brixzle pick-and-place mission: simulator or real Crazyflie"
requires-python = ">=3.10"
dependencies = ["cflib==0.1.33", "numpy>=2,<3", "scipy>=1.14,<2"]

[project.scripts]
fly = "flight.cli:main"

[tool.setuptools.packages.find]
include = ["flight*"]
