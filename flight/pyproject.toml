[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flight"
version = "0.1.0"
description = "One cflib flight program for the Brixzle pick-and-place mission: simulator or real Crazyflie"
requires-python = ">=3.10"
dependencies = ["cflib==0.1.33", "numpy>=2,<3", "scipy>=1.14,<2"]

[project.optional-dependencies]
vision = ["opencv-python>=4.10,<5"]
realsense = ["pyrealsense2>=2.56,<3"]
detector = ["onnxruntime>=1.20,<2"]
yolo = ["ultralytics==8.4.177; python_version >= '3.11'", "onnx>=1.16,<2"]
test = ["pytest>=8,<10"]

[project.scripts]
fly = "flight.cli:main"
flight-cal = "flight.calibration.cli:main"

[tool.setuptools.packages.find]
include = ["flight*"]
