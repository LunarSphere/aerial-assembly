[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aerial-assembly"
version = "0.1.0"
description = "A local CAD block drop in MuJoCo"
requires-python = ">=3.11"
dependencies = ["mujoco==3.13.0", "numpy>=2,<3", "scipy>=1.14,<2", "trimesh>=4.12.2,<5", "tetgen>=0.8.4,<0.9"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
video = ["pillow>=12,<13", "imageio>=2.37,<3", "imageio-ffmpeg>=0.6,<1"]

[project.scripts]
aerial = "aerial_assembly.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "requires_three_part_export: requires a local three_part_export/assets mesh set (fails explicitly if absent)",
    "requires_local_model: requires the two_peg_block single-solid model (fails explicitly if absent)",
]
