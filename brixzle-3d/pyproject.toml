[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "brixzle3d"
version = "0.1.0"
description = "3D drop-assembled polycube bricks: CadQuery geometry, MuJoCo assembly trials, NSGA-III search"
requires-python = ">=3.12"
dependencies = [
    "cadquery>=2.5",
    "mujoco==3.13.0",
    "numpy>=2",
    "scipy>=1.14",
    "trimesh>=4.12",
    "networkx>=3.3",
    "pymoo>=0.6.1",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
test = ["pytest>=8"]
video = ["pillow>=12", "imageio>=2.37", "imageio-ffmpeg>=0.6"]

[project.scripts]
brixzle3d = "brixzle3d.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
