[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dfbrick"
version = "0.1.0"
description = "Distributed-funnel bricks: two separated feet on a rigid rail seat in parallel-throat funnels; MuJoCo assembly trials"
requires-python = "==3.12.*"
dependencies = [
    "brixzle",
    "flight",
    "cadquery>=2.5",
    "mujoco==3.16.0",
    "numpy>=2,<3",
    "scipy>=1.14,<2",
    "trimesh>=4.12.2,<5",
    "networkx>=3.3",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
video = ["pillow>=12,<13", "imageio>=2.37,<3", "imageio-ffmpeg>=0.6,<1"]

[project.scripts]
dfbrick = "dfbrick.cli:main"

[tool.uv.sources]
brixzle = { path = "../brixzle", editable = true }
flight = { path = "../flight", editable = true }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
